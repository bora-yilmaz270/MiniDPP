name: Build and Test

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MiniDPP.slnx
      - name: Build
        run: dotnet build MiniDPP.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test MiniDPP.slnx --no-restore --configuration Release --verbosity normal
